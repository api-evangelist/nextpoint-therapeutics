aid: nextpoint-therapeutics
name: NextPoint Therapeutics
description: 'NextPoint Therapeutics is a clinical-stage biotechnology company based at 238 Main
  Street in Cambridge, Massachusetts, developing precision immuno-oncology therapeutics built on its
  scientific work on the novel B7-H7/HHLA2 checkpoint axis. Its pipeline includes a T-cell engager
  engineered for an improved therapeutic index, an antibody-drug conjugate using proprietary linker
  technology, and a multi-functional checkpoint inhibitor, each aimed at tumors that upregulate
  B7-H7. The company publishes a seven-page corporate marketing site covering its science, pipeline,
  leadership, and news; it operates no developer program, publishes no API, SDK, or machine-readable
  specification, and is profiled here for network completeness rather than for an API surface.'
